name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    env:
      COMPOSER_NO_INTERACTION: '1'
      COMPOSER_NO_PROGRESS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Runtime versions
        run: |
          php -v
          composer --version

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Resolve dependencies for this PHP
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Dependency security audit
        run: composer audit --format=summary --abandoned=fail

      - name: Quality gate
        run: composer check

      - name: Distribution smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/guiche-dist"
          composer archive --format=zip --dir="${RUNNER_TEMP}/guiche-dist" --file="guiche-ci"
          archive="$(find "${RUNNER_TEMP}/guiche-dist" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$archive"
          unzip -Z1 "$archive" > "${RUNNER_TEMP}/guiche-package.txt"

          grep -Fxq "composer.json" "${RUNNER_TEMP}/guiche-package.txt"
          grep -Fxq "README.md" "${RUNNER_TEMP}/guiche-package.txt"
          grep -Fxq "src/Guiche.php" "${RUNNER_TEMP}/guiche-package.txt"
          grep -Fxq "docs/external-consumer.md" "${RUNNER_TEMP}/guiche-package.txt"
          grep -Fxq ".env.example" "${RUNNER_TEMP}/guiche-package.txt"
          grep -Fxq "examples/clinica-piloto/.env.example" "${RUNNER_TEMP}/guiche-package.txt"

          if grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development|test)$|(^|/)(storage|tests|tools|vendor|docs/audits)/' "${RUNNER_TEMP}/guiche-package.txt"; then
            echo "Sensitive/development content leaked into Composer archive." >&2
            exit 1
          fi
